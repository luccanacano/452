<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Lucca">
    <meta name="description" content="Computer Force - Register">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Force - Register</title>

    <style>
        /* Same CSS as index.html — copy the entire <style> block from Page 1 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .container {
            display: grid;
            grid-template-columns: 60% 40%;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas:
                "header header"
                "menu menu"
                "main aside"
                "footer footer";
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        header { grid-area: header; background: #0d1b2a; padding: 1rem; text-align: center; border-bottom: 3px solid #1886f4; }
        header img { width: 80px; height: auto; }
        nav {
            grid-area: menu; background: #1a237e; padding: 1rem;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        nav ul { list-style: none; display: flex; gap: 10px; flex-wrap: wrap; }
        nav ul li a {
            font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;
            color: #ffffff; text-decoration: none; padding: 8px 14px; border-radius: 4px;
        }
        nav ul li a:hover { background-color: #1886f4; }
        .search-area { display: flex; gap: 6px; }
        .search-area input {
            font-family: Arial, sans-serif; font-size: 14px; padding: 6px 10px;
            border: 1px solid #1886f4; border-radius: 4px;
        }
        button {
            font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;
            padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
            background-color: #1886f4; color: #ffffff;
        }
        button:hover { background-color: #0d47a1; }
        main { grid-area: main; padding: 1.5rem; background: #ffffff; }
        h1 {
            font-family: Georgia, serif; font-size: 28px; color: #0d1b2a;
            margin-bottom: 1rem; border-bottom: 2px solid #1886f4; padding-bottom: 0.5rem;
        }
        h2 {
            font-family: Georgia, serif; font-size: 20px; color: #1a237e;
            margin-bottom: 0.5rem; font-weight: normal;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block; font-family: Arial, sans-serif; font-size: 14px;
            font-weight: bold; color: #0d1b2a; margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%; font-family: Arial, sans-serif; font-size: 14px;
            padding: 8px; border: 1px solid #1a237e; border-radius: 4px;
        }
        .form-group input:focus, .form-group select:focus { outline: 2px solid #1886f4; }
        .form-actions { display: flex; gap: 10px; margin-top: 1rem; }
        .form-actions button { flex: 1; }
        aside { grid-area: aside; background: #e8eaf6; padding: 1.5rem; border-left: 2px solid #1a237e; }
        aside h2 { font-family: Georgia, serif; font-size: 20px; color: #0d1b2a; margin-bottom: 1rem; }
        aside table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        aside table td {
            border: 1px solid #1a237e; padding: 8px; text-align: center;
            font-family: Arial, sans-serif; font-size: 14px; color: #0d1b2a; background: #ffffff;
        }
        .checkout-btn { width: 100%; }
        footer {
            grid-area: footer; background: #0d1b2a; color: #ffffff;
            text-align: center; padding: 1rem; border-top: 3px solid #1886f4;
        }
        footer p { font-family: Arial, sans-serif; font-size: 14px; }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas: "header" "menu" "main" "aside" "footer";
            }
            nav { flex-direction: column; align-items: stretch; }
            nav ul { justify-content: center; }
            .search-area { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <img src="../Images_HTML/452_logo.PNG" alt="Computer Force Logo">
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="01_Prod.html">Products</a></li>
            <li><a href="02_Register.html">Register</a></li>
            <li><a href="03_About.html">About</a></li>
        </ul>
        <div class="search-area">
            <input type="text" placeholder="Search..." aria-label="Search">
            <button type="button">Search</button>
        </div>
    </nav>

    <main>
        <h1>Registration Form</h1>
        <p>Please complete the following form to register for an account on our website.</p>

        <form onsubmit="showMessage(); return false;">

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" required minlength="4" placeholder="min 4 letters">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" required minlength="6" placeholder="min 6 characters">
            </div>

            <div class="form-group">
                <label for="confirmpassword">Confirm Password *</label>
                <input type="password" id="confirmpassword" required minlength="6" placeholder="min 6 characters">
            </div>

            <div class="form-group">
                <label for="firstname">First name *</label>
                <input type="text" id="firstname" required minlength="4" placeholder="min 4 letters">
            </div>

            <div class="form-group">
                <label for="surname">Surname *</label>
                <input type="text" id="surname" required minlength="4" placeholder="min 4 letters">
            </div>

            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" required>
                    <option value="">-- Select --</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="birthdate">Date of Birth</label>
                <input type="date" id="birthdate">
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" required placeholder="123 Main Street">
            </div>

            <div class="form-group">
                <label for="suburb">Suburb *</label>
                <input type="text" id="suburb" required placeholder="Suburb">
            </div>

            <div class="form-group">
                <label for="postcode">Postcode *</label>
                <input type="text" id="postcode" required maxlength="4" placeholder="4 digits">
            </div>

            <div class="form-group">
                <label for="state">State *</label>
                <select id="state" required>
                    <option value="">-- Select State --</option>
                    <option>ACT</option>
                    <option>NSW</option>
                    <option>NT</option>
                    <option>QLD</option>
                    <option>SA</option>
                    <option>TAS</option>
                    <option>VIC</option>
                    <option>WA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
            </div>

            <div class="form-actions">
                <button type="reset">Clear</button>
                <button type="submit">Register</button>
            </div>

            <div id="message" style="font-size: 18px; color: #0d1b2a; margin-top: 1rem;"></div>

        </form>
    </main>

    <aside>
        <h2>Purchases</h2>
        <table>
            <tr>
                <td>0 items.</td>
                <td>Cart sub-total: $0</td>
            </tr>
            <tr>
                <td colspan="2"><button class="checkout-btn">Go to Checkout</button></td>
            </tr>
        </table>
    </aside>

    <footer>
        <p>&copy; 2026 Lucca. All rights reserved.</p>
    </footer>

</div>

<script src="../WEB452/Web452JavaScript.js"></script>
</body>
</html>
