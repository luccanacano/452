<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Lucca">
    <meta name="description" content="Computer Force - Home">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Force - Home</title>

    <style>
        /* ===== BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* ===== LAYOUT (60% main / 40% aside) ===== */
        .container {
            display: grid;
            grid-template-columns: 60% 40%;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas:
                "header header"
                "menu menu"
                "main aside"
                "footer footer";
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        /* ===== HEADER ===== */
        header {
            grid-area: header;
            background: #0d1b2a;
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid #1886f4;
        }

        header img { width: 80px; height: auto; }

        /* ===== MENU ===== */
        nav {
            grid-area: menu;
            background: #1a237e;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav ul li a {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #1886f4;
            color: #ffffff;
        }

        .search-area { display: flex; gap: 6px; }

        .search-area input {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 6px 10px;
            border: 1px solid #1886f4;
            border-radius: 4px;
        }

        /* ===== BUTTONS ===== */
        button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #1886f4;
            color: #ffffff;
        }

        button:hover { background-color: #0d47a1; color: #ffffff; }

        /* ===== MAIN ===== */
        main {
            grid-area: main;
            padding: 1.5rem;
            background: #ffffff;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            color: #0d1b2a;
            margin-bottom: 1rem;
            border-bottom: 2px solid #1886f4;
            padding-bottom: 0.5rem;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 20px;
            color: #1a237e;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 1rem;
        }

        .product-item {
            text-align: center;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }

        .product-item img {
            width: 100%;
            max-width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-item a { text-decoration: none; color: inherit; }
        .product-item a:hover h2 { color: #1886f4; }

        /* ===== ASIDE ===== */
        aside {
            grid-area: aside;
            background: #e8eaf6;
            padding: 1.5rem;
            border-left: 2px solid #1a237e;
        }

        aside h2 {
            font-family: Georgia, serif;
            font-size: 20px;
            color: #0d1b2a;
            margin-bottom: 1rem;
        }

        aside table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        aside table td {
            border: 1px solid #1a237e;
            padding: 8px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #0d1b2a;
            background: #ffffff;
        }

        .checkout-btn { width: 100%; }

        /* ===== FOOTER ===== */
        footer {
            grid-area: footer;
            background: #0d1b2a;
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            border-top: 3px solid #1886f4;
        }

        footer p {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #ffffff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "menu"
                    "main"
                    "aside"
                    "footer";
            }
            .product-grid { grid-template-columns: repeat(2, 1fr); }
            nav { flex-direction: column; align-items: stretch; }
            nav ul { justify-content: center; }
            .search-area { justify-content: center; }
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
